<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="t d">
<title id="t">Ask-path accuracy and performance by answer backend</title>
<desc id="d">Grouped comparison on 20 development questions. Ollama CPU: answered 20%, gold cited 15%, median latency 132s. Prior Gemini Delay-8: answered 55%, gold cited 35%, median 7.3s. Current gemini-3.5-flash user test: answered 50%, gold cited 35%, median 9.3s. Ask-path retrieval hit stayed 70% across all three.</desc>
